<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz - Leaderboards</title>

    <style>
        :root {
            --bg-sepia: #f9f6f0;
            --text-sepia: #4a3f35;
            --text-light: #8c7e71;
            --border-sepia: #dcd3c6;
            --accent: #b25d38;
            --success: #5b7a5b;
            --error: #b25d38;
            --gold: #d4af37;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --font-jp: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", serif;
            --font-system: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-system);
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-sepia);
            color: var(--text-sepia);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: var(--font-jp);
            font-size: 2.5rem;
            font-weight: 400;
        }

        .btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-family: var(--font-system);
            font-weight: 500;
            color: var(--text-sepia);
            background: transparent;
            border: 1px solid var(--border-sepia);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.03);
            border-color: var(--text-sepia);
        }

        .btn-primary {
            background: var(--text-sepia);
            color: var(--bg-sepia);
            border-color: var(--text-sepia);
        }

        .btn-primary:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .score-card {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-sepia);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease;
        }

        .score-card:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.03);
        }

        .score-card.unverified {
            opacity: 0.6;
            border-style: dashed;
        }

        .rank {
            font-family: var(--font-jp);
            font-size: 2rem;
            font-weight: 600;
            width: 60px;
            text-align: center;
            color: var(--text-light);
        }

        .rank-1 {
            color: var(--gold);
            font-size: 2.5rem;
        }

        .rank-2 {
            color: var(--silver);
            font-size: 2.2rem;
        }

        .rank-3 {
            color: var(--bronze);
            font-size: 2.1rem;
        }

        .score-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-left: 20px;
            border-left: 1px solid var(--border-sepia);
        }

        .score-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-sepia);
        }

        .score-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .verified-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-verified {
            background: rgba(91, 122, 91, 0.15);
            color: var(--success);
        }

        .badge-unverified {
            background: rgba(178, 93, 56, 0.15);
            color: var(--error);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-style: italic;
        }

        .instructions {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-sepia);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Company Leaderboard</h1>
            <div style="display: flex; gap: 10px;">
                <input type="file" id="csvInput" multiple accept=".csv" hidden>
                <button id="loadBtn" class="btn btn-primary">Load SVN Scores</button>
                <a href="index.html" class="btn">Return Home</a>
            </div>
        </header>

        <div class="instructions">
            Click <strong>Load SVN Scores</strong> and select all CSV files from your <strong>scores/</strong> folder
            (after running <code>svn update</code>).
        </div>

        <div class="leaderboard-list" id="leaderboardList">
            <div class="empty-state">Select score files from your scores/ folder to view the company rankings.</div>
        </div>
    </div>

    <script src="KanjiBank.js"></script>
    <script src="QuestionBank.js"></script>
    <script>
        </script>
    <script>
        const leaderboardList = document.getElementById('leaderboardList');
        const loadBtn = document.getElementById('loadBtn');
        const csvInput = document.getElementById('csvInput');

        loadBtn.addEventListener('click', () => csvInput.click());

        // === INLINE EVALUATE ANSWER (duplicated from quiz.html for CORS-safe operation) ===
        function evaluateAnswer(userAnswer, parts) {
            const expectedFullAnswer = parts.map(p => p.reading).join('');
            const normalizedUser = userAnswer.normalize('NFC').replace(/\s/g, '');
            const normalizedExpected = expectedFullAnswer.normalize('NFC');

            if (normalizedUser === normalizedExpected) {
                return {
                    results: parts.map(p => ({ kanji: p.kanji, reading: p.reading, isCorrect: true })),
                    isFullyCorrect: true
                };
            }

            let results = [];
            let cursor = 0;
            let allPartsCorrect = true;

            for (let part of parts) {
                const reading = part.reading.normalize('NFC');
                if (cursor + reading.length <= normalizedUser.length &&
                    normalizedUser.substring(cursor, cursor + reading.length) === reading) {
                    results.push({ kanji: part.kanji, reading: part.reading, isCorrect: true });
                } else {
                    results.push({ kanji: part.kanji, reading: part.reading, isCorrect: false });
                    allPartsCorrect = false;
                }
                cursor += reading.length;
            }

            if (normalizedUser.length > normalizedExpected.length) {
                allPartsCorrect = false;
                results = results.map(r => ({ ...r, isCorrect: false }));
            }

            return { results, isFullyCorrect: allPartsCorrect };
        }

        // === REPLAY SESSION LOGS TO INDEPENDENTLY COMPUTE SCORE ===
        function replayAllSessions(sessions) {
            // Rebuild SRS state from scratch by replaying every answer
            const srsState = {}; // kanji -> { correct: 0, wrong: 0 }

            for (const session of sessions) {
                if (!session.questions || !Array.isArray(session.questions)) continue;

                for (const q of session.questions) {
                    // Find the word in questionData
                    const wordData = questionData.find(w => w.word === q.word);
                    if (!wordData) continue; // Unknown word, skip

                    // Re-evaluate the answer against the known correct readings
                    const evalResult = evaluateAnswer(q.answer || '', wordData.parts);

                    // Update SRS state for each kanji part
                    evalResult.results.forEach(res => {
                        if (!/[\u4e00-\u9faf]/.test(res.kanji)) return; // Skip pure kana parts

                        if (!(res.kanji in srsState)) {
                            srsState[res.kanji] = { correct: 0, wrong: 0 };
                        }
                        if (res.isCorrect) {
                            srsState[res.kanji].correct++;
                        } else {
                            srsState[res.kanji].wrong++;
                        }
                    });
                }
            }

            // Count remembered kanji
            let kanjiRemembered = 0;
            for (const kanji in srsState) {
                const total = srsState[kanji].correct + srsState[kanji].wrong;
                if (total >= 10 && (srsState[kanji].correct / total) >= 0.8) {
                    kanjiRemembered++;
                }
            }

            return { kanjiRemembered, srsState };
        }

        // === PARSE CSV AND VERIFY ===
        function parseAndVerifyCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return null;

            const dataLine = lines[1];
            // Parse CSV: handle quoted fields and commas
            // Format: "Name",Score,Base64Proof
            const match = dataLine.match(/^"?([^"]*)"?\s*,\s*(\d+)\s*(?:,\s*(.+))?\s*$/);
            if (!match) return null;

            const name = match[1].trim() || 'Anonymous';
            const claimedScore = parseInt(match[2], 10) || 0;
            const proofBase64 = match[3] ? match[3].trim() : null;

            let verified = false;
            let replayedScore = 0;

            if (proofBase64) {
                try {
                    const proofJson = decodeURIComponent(escape(atob(proofBase64)));
                    const sessions = JSON.parse(proofJson);

                    if (Array.isArray(sessions)) {
                        const result = replayAllSessions(sessions);
                        replayedScore = result.kanjiRemembered;
                        verified = (replayedScore === claimedScore);
                    }
                } catch (e) {
                    console.warn(`Failed to verify proof for ${name}:`, e.message);
                }
            }

            return {
                name,
                claimedScore,
                replayedScore,
                verified,
                hasProof: !!proofBase64
            };
        }

        // === RENDER LEADERBOARD ===
        function renderLeaderboard(entries) {
            leaderboardList.innerHTML = '';

            if (entries.length === 0) {
                leaderboardList.innerHTML = `<div class="empty-state">No valid scores found in the selected files.</div>`;
                return;
            }

            // Sort: verified entries first (by replayed score), then unverified (by claimed score)
            entries.sort((a, b) => {
                if (a.verified && !b.verified) return -1;
                if (!a.verified && b.verified) return 1;
                const scoreA = a.verified ? a.replayedScore : a.claimedScore;
                const scoreB = b.verified ? b.replayedScore : b.claimedScore;
                return scoreB - scoreA;
            });

            entries.forEach((entry, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const displayScore = entry.verified ? entry.replayedScore : entry.claimedScore;
                const badgeClass = entry.verified ? 'badge-verified' : 'badge-unverified';
                const badgeText = entry.verified ? '✅ Verified' : '⚠️ Unverified';
                const cardClass = entry.verified ? '' : ' unverified';

                const card = document.createElement('div');
                card.className = 'score-card' + cardClass;
                card.innerHTML = `
                    <div class="rank ${rankClass}">#${rank}</div>
                    <div class="score-details">
                        <div class="score-name">${entry.name}</div>
                        <div class="score-meta">
                            <span style="font-size: 1.1rem; color: var(--success); font-weight: 600;">Kanji Remembered: ${displayScore}</span>
                            <span class="verified-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        ${!entry.verified && entry.hasProof ? `<div style="font-size: 0.75rem; color: var(--error); margin-top: 2px;">Claimed: ${entry.claimedScore} · Replayed: ${entry.replayedScore}</div>` : ''}
                    </div>
                `;
                leaderboardList.appendChild(card);
            });
        }

        // === FILE INPUT HANDLER ===
        csvInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.csv'));
            if (files.length === 0) return;

            leaderboardList.innerHTML = `<div class="empty-state">Verifying ${files.length} score file${files.length > 1 ? 's' : ''}...</div>`;

            let parsedEntries = [];
            let filesProcessed = 0;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const result = parseAndVerifyCSV(event.target.result);
                    if (result) {
                        // Deduplicate: keep highest verified score per name
                        const existing = parsedEntries.find(e => e.name === result.name);
                        if (existing) {
                            const existingScore = existing.verified ? existing.replayedScore : existing.claimedScore;
                            const newScore = result.verified ? result.replayedScore : result.claimedScore;
                            if (newScore > existingScore || (result.verified && !existing.verified)) {
                                parsedEntries = parsedEntries.filter(e => e.name !== result.name);
                                parsedEntries.push(result);
                            }
                        } else {
                            parsedEntries.push(result);
                        }
                    }

                    filesProcessed++;
                    if (filesProcessed === files.length) {
                        renderLeaderboard(parsedEntries);
                    }
                };
                reader.onerror = () => {
                    filesProcessed++;
                    if (filesProcessed === files.length) {
                        renderLeaderboard(parsedEntries);
                    }
                };
                reader.readAsText(file);
            });

            // Reset input so re-selecting same files triggers change event
            csvInput.value = '';
        });
    </script>
</body>

</html>
