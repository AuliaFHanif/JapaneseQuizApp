<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz - Leaderboards</title>

    <style>
        :root {
            --bg-sepia: #f9f6f0;
            --text-sepia: #4a3f35;
            --text-light: #8c7e71;
            --border-sepia: #dcd3c6;
            --accent: #b25d38;
            --gold: #d4af37;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --font-jp: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", serif;
            --font-system: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-system);
            -webkit-font-smoothing: antialiased;
            background-color: var(--bg-sepia);
            color: var(--text-sepia);
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: var(--font-jp);
            font-size: 2.5rem;
            font-weight: 400;
        }

        .btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-family: var(--font-system);
            font-weight: 500;
            color: var(--text-sepia);
            background: transparent;
            border: 1px solid var(--border-sepia);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.03);
            border-color: var(--text-sepia);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .score-card {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-sepia);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease;
        }

        .score-card:hover {
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.03);
        }

        .rank {
            font-family: var(--font-jp);
            font-size: 2rem;
            font-weight: 600;
            width: 60px;
            text-align: center;
            color: var(--text-light);
        }

        .rank-1 {
            color: var(--gold);
            font-size: 2.5rem;
        }

        .rank-2 {
            color: var(--silver);
            font-size: 2.2rem;
        }

        .rank-3 {
            color: var(--bronze);
            font-size: 2.1rem;
        }

        .score-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-left: 20px;
            border-left: 1px solid var(--border-sepia);
        }

        .score-points {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-sepia);
        }

        .score-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            gap: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Company Leaderboard</h1>
            <div style="display: flex; gap: 10px;">
                <button id="loadCsvBtn" class="btn" style="background: var(--text-sepia); color: var(--bg-sepia);">Load
                    SVN Scores</button>
                <a href="index.html" class="btn">Return Home</a>
            </div>
        </header>

        <div class="leaderboard-list" id="leaderboardList">
            <div class="empty-state">Click "Load SVN Scores" to fetch and view the company rankings!</div>
        </div>
    </div>

    <script>
        const leaderboardList = document.getElementById('leaderboardList');
        const loadBtn = document.getElementById('loadCsvBtn');

        // Add the names of your CSV files here
        const FIXED_SCORE_FILES = [
            'scores/alice_score.csv',
            'scores/bob_score.csv'
        ];

        loadBtn.addEventListener('click', async () => {
            leaderboardList.innerHTML = `<div class="empty-state">Loading scores...</div>`;

            let parsedScores = [];
            let filesAttempted = 0;

            if (FIXED_SCORE_FILES.length === 0) {
                renderLeaderboard([]);
                return;
            }

            for (const filePath of FIXED_SCORE_FILES) {
                try {
                    // Fetch the file
                    const response = await fetch(filePath);
                    if (!response.ok) throw new Error(`Failed to load ${filePath}`);

                    const text = await response.text();
                    const lines = text.trim().split('\n');

                    if (lines.length >= 2) {
                        const dataLine = lines[1];
                        const parts = dataLine.split(',');
                        if (parts.length >= 2) {
                            const name = parts[0].replace(/"/g, '').trim() || 'Anonymous';
                            const score = parseInt(parts[1].trim(), 10) || 0;
                            parsedScores.push({ name, score });
                        }
                    }
                } catch (error) {
                    console.warn(error.message);
                } finally {
                    filesAttempted++;
                    if (filesAttempted === FIXED_SCORE_FILES.length) {
                        renderLeaderboard(parsedScores);
                    }
                }
            }
        });

        function renderLeaderboard(scores) {
            leaderboardList.innerHTML = '';

            if (scores.length === 0) {
                leaderboardList.innerHTML = `<div class="empty-state">No valid scores found in the selected files.</div>`;
                return;
            }

            // Sort by kanji remembered descending
            scores.sort((a, b) => b.score - a.score);

            scores.forEach((entry, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <div class="rank ${rankClass}">#${rank}</div>
                    <div class="score-details">
                        <div class="score-points" style="font-size: 1.8rem;">${entry.name}</div>
                        <div class="score-meta" style="margin-top: 8px;">
                            <span style="font-size: 1.1rem; color: var(--success); font-weight: 600;">Kanji Remembered: ${entry.score}</span>
                        </div>
                    </div>
                `;
                leaderboardList.appendChild(card);
            });
        }
    </script>
</body>

</html>
