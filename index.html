<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz - Home</title>
    <meta name="description" content="A minimalist Kanji reading quiz.">

    <style>
:root {
    --bg-sepia: #f9f6f0;
    --text-sepia: #4a3f35;
    --text-light: #8c7e71;
    --border-sepia: #dcd3c6;
    --accent: #b25d38;
    --font-jp: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", serif;
    
    /* Apple system font stack */
    --font-system: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: var(--font-system);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-sepia);
    color: var(--text-sepia);
}

.container {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    text-align: center;
}

h1 {
    font-family: var(--font-jp);
    font-size: 4rem;
    font-weight: 400;
    margin-bottom: 50px;
    color: var(--text-sepia);
    animation: softFadeIn 0.8s ease-out;
}

form {
    display: flex;
    flex-direction: column;
    gap: 35px;
}

.form-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.form-group > label {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.radio-group {
    display: flex;
    gap: 10px;
    width: 100%;
}

.radio-btn {
    flex: 1;
    position: relative;
    cursor: pointer;
    margin-bottom: 0;
}

.radio-btn input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
}

.radio-btn span {
    display: block;
    padding: 10px 0;
    text-align: center;
    border: 1px solid var(--border-sepia);
    border-radius: 6px;
    color: var(--text-light);
    transition: all 0.2s ease;
    font-size: 0.95rem;
}

.radio-btn input:checked ~ span {
    background: var(--text-sepia);
    color: var(--bg-sepia);
    border-color: var(--text-sepia);
}

.radio-btn:hover span {
    border-color: var(--text-sepia);
    color: var(--text-sepia);
}

button[type="submit"] {
    margin-top: 10px;
    padding: 15px;
    font-size: 1.1rem;
    font-family: var(--font-system);
    background: var(--text-sepia);
    color: var(--bg-sepia);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}

button[type="submit"]:hover {
    background: var(--accent);
    transform: scale(1.02);
}

.secondary-actions {
    display: flex;
    gap: 15px;
    margin-top: -15px;
}

.secondary-btn {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 0.95rem;
    font-family: var(--font-system);
    font-weight: 500;
    color: var(--text-sepia);
    border: 1px solid var(--border-sepia);
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.2s ease;
}

.secondary-btn:hover {
    background: rgba(0, 0, 0, 0.03);
    border-color: var(--text-sepia);
}

@keyframes softFadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body>
    <div class="container">
        <h1>漢字</h1>
        
        <form action="quiz.html" method="GET" id="start-form">
            <div class="form-group">
                <label>JLPT Level</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="level" value="N5" checked>
                        <span>N5</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="level" value="N4">
                        <span>N4</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="level" value="N3">
                        <span>N3</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="level" value="N2">
                        <span>N2</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="level" value="N1">
                        <span>N1</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Number of Questions</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="length" value="10">
                        <span>10</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="length" value="20" checked>
                        <span>20</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="length" value="50">
                        <span>50</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="length" value="100">
                        <span>100</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Word Category</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="checkbox" name="category" value="verb">
                        <span>Verb</span>
                    </label>
                    <label class="radio-btn">
                        <input type="checkbox" name="category" value="noun">
                        <span>Noun</span>
                    </label>
                    <label class="radio-btn">
                        <input type="checkbox" name="category" value="adjective">
                        <span>Adjective</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Quiz Mode</label>
                <div class="radio-group">
                    <label class="radio-btn">
                        <input type="radio" name="mode" value="reading" checked>
                        <span>Reading</span>
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="mode" value="meaning">
                        <span>Reading + Meaning</span>
                    </label>
                </div>
            </div>
            
            <button type="submit">Start Quiz</button>
            <div class="secondary-actions">
                <a href="stats.html" class="secondary-btn">View Stats</a>
                <a href="leaderboards.html" class="secondary-btn">Leaderboards</a>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('start-form');
        form.addEventListener('submit', function(e) {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (mode === 'meaning') {
                form.action = 'quiz-meaning.html';
            } else {
                form.action = 'quiz.html';
            }
        });
    </script>
</body>
</html>
